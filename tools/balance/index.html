<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Panel de balanceo</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header class="top-bar">
		<h1>Astro Artillery · Balanceo</h1>
		<button id="open-button" class="primary">Abrir proyecto</button>
		<button id="reload-button" title="Vuelve a leer los archivos de la carpeta (tras cambiar de rama, por ejemplo)">Recargar</button>
		<span id="status"></span>
		<span class="spacer"></span>
		<button id="discard-button">Descartar</button>
		<button id="save-button" class="primary">Guardar</button>
	</header>
	<p id="unsupported" class="warning" hidden>Este navegador no deja elegir carpetas (File System Access API). Abre el panel en Chrome o Edge.</p>
	<nav id="tab-bar" class="tab-bar"></nav>
	<main id="tab-content"></main>

	<script src="tres.js"></script>
	<script src="project.js"></script>
	<script src="table.js"></script>
	<script src="turrets.js"></script>
	<script src="enemies.js"></script>
	<script src="levels.js"></script>
	<script src="dialogs.js"></script>
	<script src="sprites.js"></script>
	<script src="app.js"></script>
</body>
</html>
